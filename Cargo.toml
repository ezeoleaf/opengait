[package]
name = "open-gait"
version = "0.1.0"
edition = "2021"
description = "Open-source real-time running gait analysis using Rust and ONNX Runtime"
license = "GPL-3.0-only"
keywords = ["gait", "biomechanics", "pose", "running", "onnx"]
categories = ["multimedia", "science"]

[dependencies]
base64 = "0.22"
jpeg-encoder = "0.6"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Optional: live camera capture (60+ FPS @ 720p)
nokhwa = { version = "0.10", features = ["input-native"], optional = true }

# Optional: ONNX Runtime inference for BlazePose / MoveNet
ort = { version = "2.0.0-rc.10", optional = true }

[features]
default = []
camera = ["dep:nokhwa"]
onnx = ["dep:ort"]

[dev-dependencies]
approx = "0.5"

[[bin]]
name = "open-gait"
path = "src/main.rs"
